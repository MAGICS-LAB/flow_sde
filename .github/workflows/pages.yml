name: Publish paper website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'docs/paper.pdf'
      - 'docs/assets/framework.png'
      - 'scripts/build_website.py'
      - 'scripts/check_website.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build static page
        run: python scripts/build_website.py
      - name: Check links and paper snapshot
        run: python scripts/check_website.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
