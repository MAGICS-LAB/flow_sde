name: CPU tests and paper artifacts

on:
  push:
    paths:
      - 'CIFAR32Exp/**'
      - 'FMPO_Evaluation/**'
      - 'NumericalExp/**'
      - 'scripts/run_tests.py'
      - 'scripts/verify_artifacts.py'
      - 'scripts/make_manifest.py'
      - 'docs/artifacts.json'
      - 'docs/paper.pdf'
      - 'requirements*.txt'
      - '.gitattributes'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - 'CIFAR32Exp/**'
      - 'FMPO_Evaluation/**'
      - 'NumericalExp/**'
      - 'scripts/run_tests.py'
      - 'scripts/verify_artifacts.py'
      - 'scripts/make_manifest.py'
      - 'docs/artifacts.json'
      - 'docs/paper.pdf'
      - 'requirements*.txt'
      - '.gitattributes'
      - '.github/workflows/tests.yml'
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [mujoco, cifar, numerical]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.4.1 torchvision==0.19.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-dev.txt
      - name: Test experiment suite
        run: python scripts/run_tests.py --suite ${{ matrix.suite }}
      - name: Verify distributed result records
        run: python scripts/verify_artifacts.py
      - name: Recreate recorded figures
        if: matrix.suite == 'numerical'
        run: python scripts/reproduce_figures.py
