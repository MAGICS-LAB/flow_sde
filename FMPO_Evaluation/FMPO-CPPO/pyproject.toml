[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fmpo-cppo"
version = "1.0.0"
description = "Flow Matching Policy Optimization with ChainPPO (built on ReinFlow)."
authors = [
    {name = "Maojiang Su"},
    {name = "Tsung-En Lin"},
    {name = "Jerry Yao-Chieh Hu"},
    {name = "Guo Ye"},
    {name = "Haoran Lu"},
    {name = "Shang Wu"},
    {name = "Zhaoran Wang"},
    {name = "Han Liu"},
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
]
dependencies = [
    "numpy>=1.24,<2",
    "einops==0.8.0",
    "gdown==5.2.0",
    "gym==0.22.0",
    "hydra-core==1.3.2",
    "imageio==2.35.1",
    "matplotlib==3.7.5",
    "omegaconf==2.3.0",
    "torch>=2.4.0",
    "tqdm==4.66.5",
    "wandb==0.17.7",
    "pandas==2.0.3",
    "psutil>=5.9",
    "scipy>=1.10",
    "opencv-python-headless==4.10.0.84",
]

[project.optional-dependencies]
gym = ["cython<3", "d4rl", "mujoco-py>=2.1,<2.2", "patchelf"]

[tool.setuptools.packages.find]
include = ["agent*", "env*", "model*", "util*"]
